# governance/freeze.toml -- the module-specific half of the freeze gate.
#
# Instantiated from cascadia-standards/templates/freeze.example.toml v1.0.0.
# src/validate_freeze.py is copied verbatim and is never edited; everything
# module-specific is data, here.

[freeze]
module = "cascadia-revenue-assurance"

# The as-of date the synthetic generator and every published measure are
# built against (brief D11). Disclosed on every output as a seeded, synthetic
# snapshot -- never a claim about a real book of business. Advancing it is a
# deliberate act, exactly as for a real freeze date.
as_of_date = "2026-06-30"

# HEAD, still, and now for a different reason. The raw layer was frozen on
# 2026-09-11 (commit "Freeze the raw layer", seed 20260911) and the conformed
# layer committed the same day, both on build/stage-1. Pinning to a SHA on an
# unmerged branch is premature: a squash merge would orphan it and the gate
# would exit non-zero against a commit that no longer exists. Pin this to the
# merge commit's SHA from a session after Aaron merges -- that is the act that
# turns "matches the last commit" into "matches the freeze".
#
# Known limit of the template gate, observed here on 2026-09-11: it compares
# with `git diff --quiet <baseline> -- <path>`, and an UNTRACKED protected
# file produces no diff, so it passes. A green gate is a claim about committed
# files; read it beside `git status`.
baseline = "HEAD"

# Part 1 has not run yet as of this commit -- nothing under data/raw/ or
# data/conformed/ exists. These globs are staged now, from the brief's step
# 0.3 and its D11/D12 file list, so Part 1's freeze commit lands under the
# gate immediately rather than needing a second setup step. A pattern matching
# nothing FAILS the gate, deliberately (validate_freeze.py) -- expected and
# correct until Part 1 runs.
protected_paths = [
  "data/raw/*",
  "data/conformed/*",
  "governance/generator_assumptions.md",
]
